[project]
name = "example-etl"
version = "0.1.0"
description = "Example Spark pipeline using shared libs"
requires-python = ">=3.12"
dependencies = ["common"]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_etl"]
