[project]
name = "common"
version = "0.1.0"
description = "Shared Spark utilities, schemas and IO for all pipelines"
requires-python = ">=3.12"
dependencies = ["pyspark==4.1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
