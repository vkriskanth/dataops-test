[project]
name = "dataops"
version = "0.1.0"
description = "Spark 4 data engineering monorepo"
requires-python = ">=3.12"
dependencies = ["common"]

[dependency-groups]
dev = ["ruff", "pylint", "pyrefly", "pytest", "pytest-cov", "chispa"]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelines"]

[tool.pytest.ini_options]
testpaths = ["libs", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["libs/*/src", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pylint.main]
source-roots = ["src", "libs/common/src"]
jobs = 0

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Docstring rules, and style checks already owned by ruff
disable = ["C0114", "C0115", "C0116", "C0301", "C0411", "C0412", "C0413", "W0611"]

[tool.pyrefly]
project-includes = ["src", "libs/*/src", "tests", "libs/*/tests"]
search-path = ["src", "libs/common/src"]
python-version = "3.12"
