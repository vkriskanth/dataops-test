[project]
name = "dataops"
version = "0.1.0"
description = "Spark 4 data engineering monorepo"
requires-python = ">=3.12"
dependencies = ["common"]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelines"]

[tool.pytest.ini_options]
testpaths = ["libs", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["libs/*/src", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
