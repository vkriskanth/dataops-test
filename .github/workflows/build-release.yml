name: Build release artifact

# Builds ONE artifact per commit on a release branch. This is the only place a wheel is
# ever produced -- QAT and PRD download it, they never rebuild. That is what makes "the
# thing QA validated" and "the thing that shipped" the same bytes.
#
# Feature branches merge into release/<date>, so every push here rebuilds the candidate
# with the accumulated release contents. Scope is computed against main, not against the
# previous push, so build-info.json always describes the WHOLE release -- deploy-prod
# relies on that list to validate the CAB-approved subset.

on:
  push:
    branches: ["release/**"]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      channel:
        type: string
        default: rc
        description: "rc (release candidate) or main"
      base:
        type: string
        default: ""
        description: "rev to diff against for scope; defaults to the merge base with main"
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      pipelines:
        value: ${{ jobs.build.outputs.pipelines }}
      blanket:
        value: ${{ jobs.build.outputs.blanket }}

concurrency:
  group: build-${{ inputs.channel || 'main' }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # the nested deploy-qat call downloads the built artifact

env:
  UV_FROZEN: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pipelines: ${{ steps.affected.outputs.pipelines }}
      blanket: ${{ steps.affected.outputs.blanket }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          VERSION="$(date -u +'%Y.%-m.%-d').${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::building ${VERSION} (channel ${{ inputs.channel || 'main' }})"

      # Always diff against main, so the artifact describes the whole release rather
      # than just the last merge into it. deploy-prod validates the CAB-approved subset
      # against this list, so a partial list would wrongly reject approved pipelines.
      - name: Determine scope
        id: affected
        run: |
          BASE="${{ inputs.base }}"
          if [ -z "$BASE" ]; then
            git fetch --no-tags --depth=0 origin main:refs/remotes/origin/main 2>/dev/null || true
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          fi
          echo "Diffing against: ${BASE:-<none, will treat as blanket>}"
          python3 .github/scripts/affected.py --base "$BASE" --head HEAD --github-output

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Stamp version and build wheels
        run: |
          python3 .github/scripts/stamp_version.py "${{ steps.version.outputs.version }}"
          uv build --package common --out-dir dist
          uv build --out-dir dist
          ls -la dist

      # Everything a later promotion needs to know, travelling with the artifact.
      - name: Write build-info.json
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import UTC, datetime

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True).stdout.strip()

          prs = sorted({
              line.split("#")[1].split(")")[0].split()[0]
              for line in sh("git", "log", "--pretty=%s", "-50").splitlines()
              if "#" in line and line.split("#")[1][:1].isdigit()
          }, key=lambda s: -int(s))

          info = {
              "version": os.environ["VERSION"],
              "channel": os.environ["CHANNEL"],
              "sha": sh("git", "rev-parse", "HEAD"),
              "ref": os.environ["REF"],
              "built_at": datetime.now(UTC).isoformat(),
              "built_by_run": os.environ.get("GITHUB_RUN_ID", ""),
              "blanket": os.environ["BLANKET"] == "true",
              "pipelines": [p for p in os.environ["PIPELINES"].split(",") if p],
              "recent_prs": prs[:50],
          }
          with open("dist/build-info.json", "w", encoding="utf-8") as fh:
              json.dump(info, fh, indent=2)
          print(json.dumps(info, indent=2))
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ inputs.channel || 'main' }}
          REF: ${{ inputs.ref || github.ref }}
          BLANKET: ${{ steps.affected.outputs.blanket }}
          PIPELINES: ${{ steps.affected.outputs.pipelines }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "### Built \`${{ steps.version.outputs.version }}\`"
            echo
            echo "- channel: \`${{ inputs.channel || 'main' }}\`"
            echo "- commit: \`$(git rev-parse --short HEAD)\`"
            echo "- scope: ${{ steps.affected.outputs.blanket == 'true' && 'BLANKET' || 'TARGETED' }}"
            echo "- pipelines: \`${{ steps.affected.outputs.pipelines }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The tracking PR to main is the release record and the CAB manifest. Refreshed on
  # every merge so it always lists the current candidate version and its contents.
  manifest:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or refresh the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PIPELINES: ${{ needs.build.outputs.pipelines }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
          BASE=$(git merge-base origin/main HEAD)

          {
            echo "## Release \`${BRANCH}\`"
            echo
            echo "Candidate: **\`${VERSION}\`**"
            echo
            echo "Pipelines in this release: \`${PIPELINES}\`"
            echo
            echo "### Contents"
            echo
            echo "| PR | Change |"
            echo "|---|---|"
            git log --pretty='%s' "${BASE}..HEAD" | while read -r line; do
              NUM=$(printf '%s' "$line" | grep -oE '#[0-9]+' | tail -1 | tr -d '#')
              [ -n "$NUM" ] || continue
              TITLE=$(printf '%s' "$line" | sed -E 's/^Merge pull request #[0-9]+ from \S+//; s/ *\(#[0-9]+\)$//')
              echo "| #${NUM} | ${TITLE:-(see PR)} |"
            done
            echo
            echo "### Production deploy"
            echo
            echo "After CAB, run **Deploy to production** with the approved PR numbers:"
            echo
            echo '```bash'
            echo "gh workflow run deploy-prod.yml \\"
            echo "  -f version=${VERSION} \\"
            echo "  -f approved_prs=101,103,104 \\"
            echo "  -f change_record=CHG0000000"
            echo '```'
            echo
            echo "Then **Close release** to merge this PR into main and tag."
          } > /tmp/body.md

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file /tmp/body.md
            echo "::notice::refreshed release PR for ${BRANCH}"
          else
            gh pr create --base main --head "$BRANCH" --draft \
              --title "Release ${BRANCH#release/}" --body-file /tmp/body.md \
              && echo "::notice::opened release PR for ${BRANCH}" \
              || echo "::warning::could not open release PR yet (no commits vs main?)"
          fi
          cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"

  # QAT tracks the release candidate: every merge into the release branch refreshes it,
  # so developers get same-day feedback and QA always tests the real release contents.
  qat:
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/deploy-qat.yml
    with:
      version: ${{ needs.build.outputs.version }}
      pipelines: ${{ needs.build.outputs.pipelines }}
      blanket: ${{ needs.build.outputs.blanket }}
      channel: rc
    permissions:
      contents: read
      actions: read
