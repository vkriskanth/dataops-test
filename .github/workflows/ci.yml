name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  # What changed, and therefore how much we test and later deploy.
  scope:
    runs-on: ubuntu-latest
    outputs:
      blanket: ${{ steps.affected.outputs.blanket }}
      pipelines: ${{ steps.affected.outputs.pipelines }}
      pytest_paths: ${{ steps.affected.outputs.pytest_paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: refs
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
              echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT" ;;
            merge_group)
              echo "base=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
              echo "head=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
              echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: affected
        run: |
          python3 .github/scripts/affected.py \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}" \
            --github-output

  # Lint and types always run over the whole repo -- they are cheap and catch
  # cross-pipeline breakage that targeted runs would miss.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check . --output-format=github
      - run: uv run ruff format --check .

  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --group dev
      - run: uv run pylint src libs/common/src tests libs/common/tests

  pyrefly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --group dev
      - run: uv run pyrefly check

  test:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --group dev
      # Targeted on a PR for a fast inner loop; everything on main, in the merge
      # queue, and whenever shared code changed.
      - name: Run tests
        env:
          BLANKET: ${{ needs.scope.outputs.blanket }}
          PYTEST_PATHS: ${{ needs.scope.outputs.pytest_paths }}
        run: |
          if [ "$BLANKET" = "true" ] || [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Full suite (blanket change, or not a PR)"
            uv run pytest
          else
            echo "Targeted suite: $PYTEST_PATHS"
            # shellcheck disable=SC2086
            uv run pytest $PYTEST_PATHS
          fi

  # Single required status check to point branch protection and the merge queue at.
  ci:
    if: always()
    needs: [scope, ruff, pylint, pyrefly, test]
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          echo "scope=${{ needs.scope.result }}"
          echo "ruff=${{ needs.ruff.result }}"
          echo "pylint=${{ needs.pylint.result }}"
          echo "pyrefly=${{ needs.pyrefly.result }}"
          echo "test=${{ needs.test.result }}"
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ] || exit 1
          [ "${{ contains(needs.*.result, 'cancelled') }}" = "false" ] || exit 1
